name: Deploy site to GitHub Pages

# Publishes the latest G2 prototype from the prototypes branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly, so new prototype commits show up without a manual run

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROTOTYPES_BRANCH: claude/project-thread-wa8xcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROTOTYPES_BRANCH }}
          path: proto
      - run: python3 scripts/build_site.py proto/prototypes _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
